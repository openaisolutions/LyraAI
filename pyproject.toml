[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-ai"
version = "0.1.0"
description = "A quantum-inspired AI framework for empathy, wisdom, and distributed computing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "sevir65", email = "sevir65@example.com"}
]
keywords = [
    "ai",
    "quantum",
    "wisdom",
    "distributed-computing",
    "pennylane",
    "scientific-computing"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "numpy",
    "pennylane",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8",
]

[project.scripts]
lyra = "lyra.__main__:main"

[project.urls]
Homepage = "https://github.com/sevir65/LyraAI"
Documentation = "https://github.com/sevir65/LyraAI#readme"
Repository = "https://github.com/sevir65/LyraAI.git"
Issues = "https://github.com/sevir65/LyraAI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lyra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
